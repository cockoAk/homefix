<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cultura Dominicana Quiz</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Encabezado -->
        <header class="header">
            <div class="logo">
                <i class="fas fa-landmark"></i>
                <h1>Dominican<span>Quiz</span></h1>
            </div>
            <p class="tagline">Aprende sobre cultura dominicana jugando</p>
        </header>

        <!-- Contenido principal -->
        <main class="main-content">
            <!-- Sección de Login -->
            <section id="login-section" class="card">
                <h2><i class="fas fa-sign-in-alt"></i> Iniciar Sesión</h2>
                <form id="login-form">
                    <div class="form-group">
                        <label for="login-email"><i class="fas fa-envelope"></i> Email</label>
                        <input type="email" id="login-email" placeholder="tu@email.com" required>
                    </div>
                    <div class="form-group">
                        <label for="login-password"><i class="fas fa-lock"></i> Contraseña</label>
                        <input type="password" id="login-password" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-sign-in-alt"></i> Entrar
                    </button>
                    <p class="form-footer">
                        ¿No tienes cuenta? <a href="#" id="show-register">Regístrate aquí</a>
                    </p>
                </form>
            </section>

            <!-- Sección de Registro (oculta inicialmente) -->
            <section id="register-section" class="card hidden">
                <h2><i class="fas fa-user-plus"></i> Crear Cuenta</h2>
                <form id="register-form">
                    <div class="form-group">
                        <label for="register-name"><i class="fas fa-user"></i> Nombre Completo</label>
                        <input type="text" id="register-name" placeholder="Juan Pérez" required>
                    </div>
                    <div class="form-group">
                        <label for="register-email"><i class="fas fa-envelope"></i> Email</label>
                        <input type="email" id="register-email" placeholder="tu@email.com" required>
                    </div>
                    <div class="form-group">
                        <label for="register-age"><i class="fas fa-birthday-cake"></i> Edad</label>
                        <input type="number" id="register-age" min="10" max="100" value="20" required>
                    </div>
                    <div class="form-group">
                        <label for="register-password"><i class="fas fa-lock"></i> Contraseña</label>
                        <input type="password" id="register-password" placeholder="Mínimo 6 caracteres" required>
                    </div>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-check"></i> Registrarse
                    </button>
                    <p class="form-footer">
                        ¿Ya tienes cuenta? <a href="#" id="show-login">Inicia sesión aquí</a>
                    </p>
                </form>
            </section>

            <!-- Sección de Invitado -->
            <section class="card guest-card">
                <h2><i class="fas fa-gamepad"></i> Jugar como Invitado</h2>
                <p>Únete a un juego sin registrarte</p>
                <form id="guest-form">
                    <div class="form-group">
                        <label for="guest-name"><i class="fas fa-user"></i> Tu Nombre</label>
                        <input type="text" id="guest-name" placeholder="Ej: Estudiante1" required>
                    </div>
                    <div class="form-group">
                        <label for="room-code"><i class="fas fa-door-open"></i> Código de Sala</label>
                        <input type="text" id="room-code" placeholder="Ej: A1B2C3D4" required>
                    </div>
                    <button type="submit" class="btn btn-accent">
                        <i class="fas fa-play"></i> Unirse al Juego
                    </button>
                </form>
            </section>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>Proyecto Final - Programación III</p>
            <p class="tech-badge">
                <i class="fas fa-code"></i> FastAPI + MySQL + WebSockets
            </p>
        </footer>
    </div>

    <!-- Mensajes flotantes -->
    <div id="message-container"></div>

    <!-- Scripts -->
    <script src="js/auth.js"></script>
    <script src="js/ui.js"></script>
</body>
</html>
